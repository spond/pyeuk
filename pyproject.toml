[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyeuk"
version = "0.6.0"
description = "Modern Python package for eukaryotic amplicon MLST genotyping, Eukaryotyping ensemble distance engine, and outbreak cluster finder"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "BRC-Analytics / CDC Modernization Team" }]
keywords = ["MLST", "cgMLST", "Cyclospora", "Cryptosporidium", "Plasmodium", "outbreak", "genotyping", "eukaryotyping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "numba>=0.53.0",
]

[project.optional-dependencies]
amplicon = [
    "pysam>=0.22",
]

[project.urls]
Homepage = "https://github.com/spond/pyeuk"
Source = "https://github.com/spond/pyeuk"
Issues = "https://github.com/spond/pyeuk/issues"

[project.scripts]
pyeuk = "pyeuk.cli:main"
cyclospora-typing = "pyeuk.cli:main"

[tool.setuptools]
packages = ["pyeuk", "pyeuk.amplicon", "cyclospora_pyeuk", "cyclospora_pyeuk.amplicon"]
